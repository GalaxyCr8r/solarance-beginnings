# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello, World!

env:
  RUST_BACKTRACE: '1'

includes:
  server:
    taskfile: ./server/Taskfile.yml
    dir: server
  client: 
    taskfile: ./client/Taskfile.yml
    dir: client
  admin: 
    taskfile: ./client-admin/Taskfile.yml
    dir: client-admin

tasks:

  # /// SpacetimeDB ///
  start:
    desc: "STDB: Start SpacetimeDB"
    cmds:
      - spacetime start
    silent: false
    sources: []
    generates: []
#    interactive: true

  show-token:
    desc: "STDB: Show Login Token"
    cmds:
      - spacetime login show --token

  list-local:
    desc: "STDB: List Local ST Databases"
    cmds:
      - spacetime list

  list-maincloud:
    desc: "STDB: List Maincloud ST Databases"
    cmds:
      - spacetime list -s maincloud

  logs:
    desc: "STDB: View Logs for Solarance"
    cmds:
      - spacetime logs solarance-beginnings

  # /// Blast Radius ///

  br-analyze:
    desc: "BR: Re-analyze"
    cmds:
      - blastradius analyze ./client
      - blastradius analyze ./client-admin
      - blastradius analyze ./server
      - blastradius analyze ./solarance-shared

  br-update-symbols:
    desc: "BR: Update the Symbols in CLAUDE.md"
    cmds:
      - blastradius symbols ./client --inline --claude-md
      - blastradius symbols ./client-admin --inline --claude-md
      - blastradius symbols ./server --inline --claude-md
      - blastradius symbols ./solarance-shared --inline --claude-md
